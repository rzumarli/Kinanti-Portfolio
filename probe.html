<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>probe</title>
<style>body{font-family:monospace;font-size:13px;margin:8px}iframe{display:block;border:1px solid #999;margin:0 0 8px}pre{white-space:pre-wrap;margin:0 0 24px}</style>
</head>
<body>
<div id="out">WAITING</div>
<script>
var widths = [768, 900, 1024];
var results = [];
var done = 0;
widths.forEach(function(w, idx){
  var f = document.createElement('iframe');
  f.width = w; f.height = 700; f.src = 'index.html?probe=' + w;
  document.body.appendChild(f);
  var pre = document.createElement('pre');
  pre.id = 'r' + w;
  pre.textContent = '=== ' + w + ' pending ===';
  document.body.appendChild(pre);
  f.addEventListener('load', function(){
    setTimeout(function(){ measure(f, w, pre); }, 900);
  });
});
function measure(f, w, pre){
  try {
    var d = f.contentDocument;
    var win = f.contentWindow;
    var f3 = d.querySelector('[data-pencil-name="Frame 3"]');
    var f19 = d.querySelector('[data-pencil-name="Frame 19"]');
    var f18 = d.querySelector('[data-pencil-name="Frame 18"]');
    var pe = d.querySelector('[data-pencil-name="pe"]');
    var pd = d.querySelector('[data-pencil-name="ple-driven"]');
    var L = [];
    L.push('=== WIDTH ' + w + ' ===');
    L.push('innerWidth=' + win.innerWidth);
    L.push('fonts.status=' + (d.fonts ? d.fonts.status : 'n/a'));
    L.push('Frame19 clientWidth=' + (f19 ? f19.clientWidth : 'NOT FOUND'));
    L.push('Frame18 clientWidth=' + (f18 ? f18.clientWidth : 'NOT FOUND') + ' scrollWidth=' + (f18 ? f18.scrollWidth : ''));
    if (f3) {
      var r3 = f3.getBoundingClientRect();
      L.push('Frame3 clientWidth=' + f3.clientWidth + ' scrollWidth=' + f3.scrollWidth + ' rect.width=' + r3.width.toFixed(1) + ' rect.x=' + r3.x.toFixed(1));
      var cs = win.getComputedStyle(f3);
      L.push('Frame3 computed width=' + cs.width + ' overflowX=' + cs.overflowX);
      var kids = f3.children;
      for (var i = 0; i < kids.length; i++) {
        var k = kids[i], kr = k.getBoundingClientRect();
        L.push('  child[' + i + '] ' + k.tagName + ' name=' + (k.getAttribute('data-pencil-name') || '-') + ' x=' + kr.x.toFixed(1) + ' w=' + kr.width.toFixed(1) + ' right=' + kr.right.toFixed(1) + (kr.right > r3.right + 0.5 ? ' OVERFLOW +' + (kr.right - r3.right).toFixed(1) : ''));
      }
    } else L.push('Frame3 NOT FOUND');
    [ ['pe', pe], ['ple-driven', pd] ].forEach(function(pair){
      var el = pair[1];
      if (!el) { L.push(pair[0] + ' NOT FOUND'); return; }
      var cs = win.getComputedStyle(el);
      var r = el.getBoundingClientRect();
      L.push(pair[0] + ': fontSize=' + cs.fontSize + ' fontFamily=' + cs.fontFamily + ' rect.w=' + r.width.toFixed(1) + ' scrollW=' + el.scrollWidth);
      var cv = d.createElement('canvas').getContext('2d');
      cv.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      L.push(pair[0] + ' canvas measureText(' + JSON.stringify(el.textContent.trim()) + ')=' + cv.measureText(el.textContent.trim()).width.toFixed(1));
    });
    pre.textContent = L.join('\n');
  } catch(e) {
    pre.textContent = '=== WIDTH ' + w + ' ERROR ' + e.message + ' ===';
  }
  done++;
  if (done === widths.length) document.getElementById('out').textContent = 'ALL DONE';
}
</script>
</body>
</html>
